<!DOCTYPE html>
<html>
<body>

<p id="txt" style="font-size:50px;">Hello</p>

<button onclick="inc()">Increase</button>
<button onclick="stop()">Stop</button>
<button onclick="dec()">Decrease</button>

<script>
var size = 50;
var t;

function inc() {
    clearInterval(t);
    t = setInterval(function() {
        if(size < 200) {
            size++;
            document.getElementById("txt").style.fontSize = size + "px";
        } else {
            clearInterval(t);
        }
    }, 100);
}

function dec() {
    clearInterval(t);
    t = setInterval(function() {
        if(size > 20) {
            size--;
            document.getElementById("txt").style.fontSize = size + "px";
        } else {
            clearInterval(t);
        }
    }, 100);
}

function stop() {
    clearInterval(t);
}
</script>

</body>
</html>
