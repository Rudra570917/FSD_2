<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const student = [
        { name: "ABC", height: 5.7 },
        { name: "PQR", height: 6.0 },
        { name: "XYZ", height: 6.2 },
      ];
      const ss = student.sort((a, b) => b.height - a.height);
      // Print name and height of each student
      console.log(ss)
      for (const person of ss) {
        console.log(`${person.name}: ${person.height}`);
      }
    </script>
  </body>
</html>
